<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="buddyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="buddyGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Background Squircle -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)" />
  <rect width="98" height="98" x="1" y="1" rx="25" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Outer Interlocking Glowing Rings forming Heart + Bot Orbit -->
  <!-- Left Heart Loop -->
  <path
    d="M 38 28 C 24 28, 16 38, 16 50 C 16 62, 25 72, 38 72 C 45 72, 51 68, 55 62 C 59 68, 65 72, 72 72 C 85 72, 94 62, 94 50 C 94 38, 85 28, 72 28 C 65 28, 59 32, 55 38 C 51 32, 45 28, 38 28 Z"
    fill="none"
    stroke="url(#buddyGrad1)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Intersecting Central Orbit -->
  <ellipse
    cx="50"
    cy="50"
    rx="22"
    ry="24"
    fill="none"
    stroke="url(#buddyGrad2)"
    stroke-width="5"
    opacity="0.9"
  />

  <!-- Friendly Smiling AI Face inside the union -->
  <!-- Left Eye -->
  <circle cx="43" cy="46" r="3.2" fill="#38bdf8" />
  <!-- Right Eye -->
  <circle cx="57" cy="46" r="3.2" fill="#38bdf8" />
  <!-- Smile Arc -->
  <path
    d="M 43 54 Q 50 61, 57 54"
    fill="none"
    stroke="#38bdf8"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Ambient Light Sparkle -->
  <circle cx="28" cy="34" r="1.5" fill="#ffffff" opacity="0.8" />
</svg>
